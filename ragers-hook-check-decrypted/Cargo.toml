#:schema https://www.schemastore.org/cargo.json

[package]
name = "ragers-hook-check-decrypted"
version = "1.0.0"
description = "Hook for pre-commit/Prek ensuring that no decrypted files with Ragers are commited by accident"

edition.workspace = true
rust-version.workspace = true
readme.workspace = true
repository.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
ragers-core = { path = "../ragers-core" }

exitcode = "1.1.2"
lexopt = "0.3.2"
same-file = "1.0.6"
