#:schema https://www.schemastore.org/cargo.json

[workspace]
members = ["ragers", "ragers-hook-check-decrypted"]
default-members = ["ragers"]
resolver = "3"

[workspace.package]
authors = ["Sutaai <sutaai@proton.me>"]
edition = "2024"
rust-version = "1.96"
readme = "README.md"
repository = "https://codeberg.org/Sutaai/Ragers"
license = "MIT"
publish = false

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
