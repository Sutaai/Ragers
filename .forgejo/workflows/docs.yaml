name: Documentation
on:
  push:
    branches:
      - main
    paths:
      - .forgejo/workflows/docs.yaml
      - docs/**/*
      - zensical.toml
      - mise.toml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: codeberg-small-lazy
    steps:
      - uses: actions/checkout@v7

      - name: Install mise and tools
        uses: https://github.com/jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        timeout-minutes: 5

      - name: Build documentation
        run: zensical build --clean

      - name: Publish to pages
        uses: https://codeberg.org/git-pages/action@v2
        with:
          site: https://ragers.sutaai.dev/
          server: codeberg.page
          token: ${{ forge.token }}
          source: site/
          pretty-urls: true
