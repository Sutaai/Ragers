on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  prek:
    # Check if pull request doesn't start with WIP:
    if: ${{ !startsWith(forgejo.event.pull_request.title, 'WIP:') }}
    runs-on: codeberg-tiny-lazy
    name: Run Prek on project
    steps:
      - name: Checkout repo
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Install rustup
        run: |
          apt update -y
          apt install rustup -y

      - name: Install rust with rustup
        run: |
          rustup -v update 1.96

      - name: Run Prek
        uses: https://github.com/j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 #v3.0.1
