#:schema https://www.schemastore.org/cargo.json

[package]
name = "ragers"
description = "Ragers - Rust age's repository solution"
version = "0.3.0-dev1"

authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
age = { version = "0.12.1", features = ["armor", "cli-common", "ssh"] }
clap = { version = "4.6.1", features = ["cargo", "derive", "env"] }
config = { version = "0.15.25", features = ["yaml"] }
inquire = { version = "0.9.4", features = ["editor"] }
itertools = "0.15.0"
serde = { version = "1.0.228", features = ["serde_derive"] }
thiserror = { version = "2.0.19", features = ["std"] }
which = "8.0.6"
